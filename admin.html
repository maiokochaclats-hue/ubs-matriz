<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">
<title>Login — Fundação São Sebastião</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 380px; max-width: 100%; }
  h1 { font-size: 22px; margin-bottom: 4px; text-align: center; color: #f1f5f9; }
  h2 { font-size: 13px; color: #94a3b8; font-weight: normal; margin-bottom: 24px; text-align: center; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; margin-top: 12px; }
  input { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; }
  input:focus { outline: none; border-color: #3b82f6; }
  button { background: #3b82f6; border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; margin-top: 20px; }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .erro { background: #7f1d1d; border: 1px solid #dc2626; color: #fecaca; padding: 10px 14px; border-radius: 8px; margin-top: 16px; font-size: 13px; display: none; }
  .erro.ativo { display: block; }
  .rodape { font-size: 11px; color: #64748b; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="box">
  <h1>🏛️ Fundação São Sebastião</h1>
  <h2>Sistema de Gestão</h2>
  <div class="erro" id="erro"></div>
  <label>Usuário</label>
  <input type="text" id="usuario" autofocus onkeydown="if(event.key==='Enter') entrar()">
  <label>Senha</label>
  <input type="password" id="senha" onkeydown="if(event.key==='Enter') entrar()">
  <button id="btn" onclick="entrar()">Entrar</button>
  <div class="rodape">Acesso restrito</div>
</div>
<script>
async function entrar() {
  const usuario = document.getElementById('usuario').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn');
  const erro = document.getElementById('erro');

  if (!usuario || !senha) {
    erro.textContent = 'Preencha usuário e senha.';
    erro.classList.add('ativo');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verificando...';
  erro.classList.remove('ativo');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, senha })
    });
    const data = await res.json();

    if (data.ok) {
      document.cookie = `token=${data.token}; path=/; max-age=${24*60*60}; SameSite=Strict`;
      localStorage.setItem('token_ubs', data.token);
      localStorage.setItem('papel', data.papel);
      localStorage.setItem('dados_usuario', JSON.stringify(data.dados));

      // Redireciona para o painel correto
      if (data.papel === 'presidencia') location.href = '/presidencia';
      else if (data.papel === 'diretoria') location.href = '/diretoria';
      else if (data.papel === 'apoio') location.href = '/apoio';
      else location.href = '/';
    } else {
      erro.textContent = data.erro || 'Usuário ou senha inválidos.';
      erro.classList.add('ativo');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      document.getElementById('senha').value = '';
      document.getElementById('senha').focus();
    }
  } catch (e) {
    erro.textContent = 'Erro de conexão com o servidor.';
    erro.classList.add('ativo');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
