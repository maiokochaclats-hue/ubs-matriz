<script>
const SUPABASE_URL = 'https://gtmgqvoesezshgsthxhr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9v7pBfemMd0MR8E55Tkt4g_oknrNWrc';
const BUCKET = 'ubs-documentos';
const LIMITE_MB = 10;

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let ubsMap = {};
let ubsSelecionada = null;
let ws = null;
let estado = null;
let todasUnidades = [];
let somLigado = false;
let audioCtx = null;
let filtroDocAtual = 'todos';
let mensagensRecebidas = [];
let mensagensEnviadas = [];
let msgsNaoLidas = 0;
let diretoriasAbertas = {};

// ============ UTIL ============
function tocarBip() {
  if (!somLigado) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

}

function sair() {
  document.cookie = 'token=; path=/; max-age=0';
  localStorage.clear();
  location.href = '/';
}

function setStatus(t, txt) {
  const el = document.getElementById('status-servidor');
  el.className = 'status-servidor ' + t;
  el.textContent = txt;
}

function formatarData(iso) {
  const d = new Date(iso);
  const hoje = new Date();
  const ontem = new Date(hoje); ontem.setDate(ontem.getDate() - 1);
  if (d.toDateString() === hoje.toDateString()) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === ontem.toDateString()) return 'Ontem ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// ============ INICIALIZAÇÃO ============
async function inicializar() {
  const dados = JSON.parse(localStorage.getItem('dados_usuario') || '{}');
  document.getElementById('titulo').textContent = '🏛️ ' + (dados.cargo || 'Presidência');
  document.getElementById('subtitulo').textContent = dados.nome || '—';

  // Busca estado do admin (que tem todas as diretorias + unidades)
  try {
    const res = await fetch('/api/admin/estado');
    const data = await res.json();
    if (data.ok) {
      estado = data.estado;
      // Monta lista completa de unidades
      todasUnidades = [];
      estado.diretorias.forEach(d => {
        d.unidades.forEach(u => {
          todasUnidades.push({ ...u, diretoria_id: d.id, diretoria_nome: d.nome, regiao: u.regiao || d.nome });
        });
      });
    }
  } catch (e) { console.error(e); }

  await carregarDestinatarios();
  await carregarMensagens();

  conectarWS();
}

// ============ WEBSOCKET ============
function conectarWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);
  ws.onopen = () => {
    setStatus('ok', '🟢 Servidor conectado');
    ws.send(JSON.stringify({ type: 'ola_presidencia' }));
  };
  ws.onclose = () => {
    setStatus('err', '🔴 Desconectado');
    setTimeout(conectarWS, 3000);
  };
  ws.onerror = () => setStatus('err', '🔴 Erro');
  ws.onmessage = (ev) => handleMsg(JSON.parse(ev.data));
}

function handleMsg(msg) {
  switch (msg.type) {
    case 'estado_inicial':
      (msg.ubs || []).forEach(u => { ubsMap[u.id] = u; });
      renderListaDiretorias();
      break;

    case 'ubs_registrada':
      ubsMap[msg.ubs.id] = msg.ubs;
      renderListaDiretorias();
      break;

    case 'ubs_online':
      if (ubsMap[msg.ubs_id]) { ubsMap[msg.ubs_id].online = true; renderListaDiretorias(); }
      break;

    case 'ubs_offline':
      if (ubsMap[msg.ubs_id]) { ubsMap[msg.ubs_id].online = false; renderListaDiretorias(); }
      break;

    case 'novo_dado':
      if (ubsMap[msg.ubs_id]) {
        const ubs = ubsMap[msg.ubs_id];
        ubs.piscando = true;
        ubs.novosDados = (ubs.novosDados || 0) + 1;
        const setor = ubs.setores.find(s => s.id === msg.setor_id);
        if (setor) {
          setor.piscando = true;
          setor.dados = { ...setor.dados, ...msg.dados };
          setor.ultimaAtualizacao = new Date().toISOString();
          if (!setor.historico) setor.historico = [];
          setor.historico.unshift({ ts: setor.ultimaAtualizacao, dados: { ...setor.dados } });
          if (setor.historico.length > 50) setor.historico.length = 50;
        }
        renderListaDiretorias();
        if (ubsSelecionada === ubs.id) renderSetores(ubs);
        tocarBip();
      }
      break;

    case 'parar_piscar':
      if (ubsMap[msg.ubs_id]) {
        const ubs = ubsMap[msg.ubs_id];
        ubs.piscando = false;
        const setor = ubs.setores.find(s => s.id === msg.setor_id);
        if (setor) setor.piscando = false;
        renderListaDiretorias();
        if (ubsSelecionada === ubs.id) renderSetores(ubs);
      }
      break;

    case 'documento_recebido':
      if (ubsMap[msg.ubs_id]) {
        const ubs = ubsMap[msg.ubs_id];
        if (!ubs.documentos) ubs.documentos = [];
        msg.documentos.forEach(doc => {
          ubs.documentos.unshift({
            ...doc,
            setor_id: msg.setor_id,
            setor_nome: msg.setor_nome,
            origem: msg.origem,
            ts: new Date().toISOString()
          });
        });
        if (msg.origem === 'filial') {
          ubs.docsNaoLidos = (ubs.docsNaoLidos || 0) + msg.documentos.length;
          tocarBip();
        }
        renderListaDiretorias();
        if (ubsSelecionada === ubs.id) renderDocs(ubs);
      }
      break;

    case 'mensagem_recebida':
      mensagensRecebidas.unshift(msg.mensagem);
      msgsNaoLidas++;
      atualizarBadgeMsgs();
      renderRecebidas();
      tocarBip();
      mostrarToast(`📨 Nova mensagem de ${msg.mensagem.de_nome}`);
      break;

    case 'mensagem_enviada':
      mensagensEnviadas.unshift(msg.mensagem);
      renderEnviadas();
      break;

    case 'erro_mensagem':
      mostrarAvisoForm('erro', msg.texto);
      break;

    case 'aviso':
    case 'aviso_enviado':
      mostrarAviso(msg.aviso);
      tocarBip();
      break;
  }
}

// ============ LISTA DIRETORIAS ============
function renderListaDiretorias() {
  if (!estado) return;
  const container = document.getElementById('lista-diretorias');
  container.innerHTML = '';

  estado.diretorias.forEach(dir => {
    const bloco = document.createElement('div');
    bloco.className = 'diretoria-bloco';

    // Calcula contadores
    const ids = dir.unidades.map(u => u.id);
    const ativos = Object.values(ubsMap).filter(u => ids.includes(u.id));
    const online = ativos.filter(u => u.online).length;
    const offline = ids.length - online;
    const novos = ativos.reduce((a, u) => a + (u.novosDados || 0), 0);
    const docs = ativos.reduce((a, u) => a + (u.docsNaoLidos || 0), 0);

    const aberto = diretoriasAbertas[dir.id] ? 'aberto' : '';

    bloco.innerHTML = `
      <div class="diretoria-header" onclick="toggleDiretoria('${dir.id}')">
        <div>
          <div class="nome">📁 ${dir.nome}</div>
          <div class="diretor">Diretor(a): ${dir.diretor || '—'} • ${dir.unidades.length} unidade(s)</div>
        </div>
        <div class="contadores">
          <span class="stat-online">🟢 ${online}</span>
          <span class="stat-offline">🔴 ${offline}</span>
          ${novos > 0 ? `<span class="stat-novos">🔵 ${novos}</span>` : ''}
          ${docs > 0 ? `<span class="stat-docs">📁 ${docs}</span>` : ''}
          <span class="badge-reg">${aberto ? '▼' : '▶'}</span>
        </div>
      </div>
      <div class="diretoria-body ${aberto}">
        <div class="grid-ubs" id="grid-${dir.id}"></div>
      </div>
    `;
    container.appendChild(bloco);

    // Renderiza grid da diretoria
    const grid = bloco.querySelector('#grid-' + dir.id);
    if (dir.unidades.length === 0) {
      grid.innerHTML = '<div class="vazio-msg">Nenhuma unidade cadastrada nesta diretoria.</div>';
    } else {
      dir.unidades.forEach(mu => {
        const u = ubsMap[mu.id] || { id: mu.id, nome: mu.nome, regiao: mu.regiao, online: false, setores: [], documentos: [] };
        const card = document.createElement('div');
        card.className = `ubs-card ${u.online ? 'online' : 'offline'} ${u.piscando ? 'piscando' : ''}`;
        card.onclick = (ev) => { ev.stopPropagation(); abrirModal(u.id); };
        card.innerHTML = `
          <div class="ubs-nome">${u.nome}</div>
          <div class="ubs-status">
            <span class="dot ${u.online ? 'online' : 'offline'}"></span>
            <span>${u.online ? 'Online' : 'Offline'}</span>
          </div>
          ${u.novosDados > 0 ? `<div class="badge-novo">${u.novosDados}</div>` : ''}
          ${u.docsNaoLidos > 0 ? `<div class="badge-doc">${u.docsNaoLidos}</div>` : ''}`;
        grid.appendChild(card);
      });
    }
  });

  atualizaStats();
}

function toggleDiretoria(id) {
  diretoriasAbertas[id] = !diretoriasAbertas[id];
  renderListaDiretorias();
}

function expandirTodas() {
  if (!estado) return;
  estado.diretorias.forEach(d => { diretoriasAbertas[d.id] = true; });
  renderListaDiretorias();
}

function recolherTodas() {
  diretoriasAbertas = {};
  renderListaDiretorias();
}

function atualizaStats() {
  const ativos = Object.values(ubsMap);
  const totalEsperado = estado ? estado.diretorias.reduce((a, d) => a + d.unidades.length, 0) : 0;
  document.getElementById('stat-online').textContent = ativos.filter(u => u.online).length;
  document.getElementById('stat-offline').textContent = totalEsperado - ativos.filter(u => u.online).length;
  document.getElementById('stat-novos').textContent = ativos.reduce((a, u) => a + (u.novosDados || 0), 0);
  document.getElementById('stat-docs').textContent = ativos.reduce((a, u) => a + (u.docsNaoLidos || 0), 0);
}

// ============ MODAL UNIDADE ============
function abrirModal(ubsId) {
  const ubs = ubsMap[ubsId];
  if (!ubs) return;

  fetch('/api/marcar-lido', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ubs_id: ubsId })
  }).catch(() => {});

  if (ubs.docsNaoLidos > 0) ubs.docsNaoLidos = 0;
  ubsSelecionada = ubsId;
  ubs.novosDados = 0;
  ubs.piscando = false;
  document.getElementById('modal-titulo').textContent = ubs.nome;
  document.getElementById('modal-status').innerHTML =
    `<span class="dot ${ubs.online ? 'online' : 'offline'}"></span> ${ubs.online ? 'Online' : 'Offline'} • ${ubs.diretoria_nome || ''}`;
  renderSetores(ubs);
  renderDocs(ubs);
  document.getElementById('modal-ubs').classList.add('ativo');
  renderListaDiretorias();
}

function renderSetores(ubs) {
  const grid = document.getElementById('grid-setores');
  grid.innerHTML = '';
  if (!ubs.setores || ubs.setores.length === 0) {
    grid.innerHTML = '<div style="color:#64748b;padding:20px;grid-column:1/-1;">Nenhum setor conectado ainda.</div>';
    return;
  }
  ubs.setores.forEach(setor => {
    const card = document.createElement('div');
    card.className = `setor-card ${setor.piscando ? 'piscando' : ''}`;
    const dados = Object.entries(setor.dados || {}).map(([k, v]) => `<div>${k}: <b>${v || '—'}</b></div>`).join('') || '<div style="color:#64748b;">Sem dados</div>';
    const ts = setor.ultimaAtualizacao ? new Date(setor.ultimaAtualizacao).toLocaleTimeString('pt-BR') : '—';
    const hist = (setor.historico || []).slice(0, 10).map(h => `
      <div class="historico-item">
        <span class="ht">${new Date(h.ts).toLocaleString('pt-BR')}</span> —
        <span class="hd">${Object.entries(h.dados).map(([k,v]) => `${k}: ${v || '—'}`).join(' | ')}</span>
      </div>`).join('') || '<div style="color:#64748b;font-size:10px;">Sem histórico.</div>';

    card.innerHTML = `
      ${setor.piscando ? '<div class="badge-setor">NOVO</div>' : ''}
      <div class="setor-nome">📋 ${setor.nome}</div>
      <div class="setor-dados">${dados}</div>
      <div class="setor-timestamp">Atualizado: ${ts}</div>
      <div class="historico-toggle" onclick="toggleHistorico(this)">▸ Ver histórico (${(setor.historico||[]).length})</div>
      <div class="historico-lista">${hist}</div>`;
    grid.appendChild(card);
  });
}

function renderDocs(ubs) {
  const lista = document.getElementById('doc-lista');
  let docs = ubs.documentos || [];
  if (filtroDocAtual === 'filial') docs = docs.filter(d => d.origem === 'filial');
  if (filtroDocAtual === 'diretoria') docs = docs.filter(d => d.origem === 'matriz');
  if (docs.length === 0) { lista.innerHTML = '<div class="doc-vazio">Nenhum documento.</div>'; return; }

  lista.innerHTML = '';
  docs.slice(0, 50).forEach(d => {
    const item = document.createElement('div');
    item.className = `doc-item-modal ${d.origem === 'matriz' ? 'matriz' : ''}`;
    const tamanho = d.tamanho ? ` • ${(d.tamanho/1024).toFixed(0)} KB` : '';
    const data = d.ts ? new Date(d.ts).toLocaleString('pt-BR') : '';
    const origemTxt = d.origem === 'matriz' ? '📤 Enviado pela Presidência/Diretoria' : `📥 Recebido de ${d.setor_nome || 'setor'}`;
    item.innerHTML = `
      <div class="info">
        <div class="nome">📄 ${d.nome}</div>
        <div class="meta">${origemTxt} • ${data}${tamanho}</div>
      </div>
      <a href="${d.url}" target="_blank" rel="noopener">Baixar</a>`;
    lista.appendChild(item);
  });
}

function filtrarDocs(btn) {
  document.querySelectorAll('.filtros-doc button').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  filtroDocAtual = btn.dataset.filtro;
  const ubs = ubsMap[ubsSelecionada];
  if (ubs) renderDocs(ubs);
}

function toggleHistorico(el) {
  const lista = el.nextElementSibling;
  lista.classList.toggle('aberto');
  el.textContent = lista.classList.contains('aberto') ? '▾ Ocultar histórico' : `▸ Ver histórico (${lista.children.length})`;
}

function fecharModal() {
  document.getElementById('modal-ubs').classList.remove('ativo');
  ubsSelecionada = null;
  filtroDocAtual = 'todos';
  document.querySelectorAll('.filtros-doc button').forEach((b, i) => b.classList.toggle('ativo', i === 0));
}

// ============ ENVIO DE DOCUMENTO ============
function abrirEnvioDoc() {
  if (todasUnidades.length === 0) return alert('Nenhuma unidade cadastrada.');
  const sel = document.getElementById('select-destino');
  sel.innerHTML = '<option value="">— Selecione a unidade —</option>';

  // Agrupa por diretoria
  const porDir = {};
  todasUnidades.forEach(u => {
    if (!porDir[u.diretoria_nome]) porDir[u.diretoria_nome] = [];
    porDir[u.diretoria_nome].push(u);
  });

  Object.keys(porDir).forEach(dirNome => {
    const optgroup = document.createElement('optgroup');
    optgroup.label = dirNome;
    porDir[dirNome].forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.nome;
      optgroup.appendChild(opt);
    });
    sel.appendChild(optgroup);
  });

  document.getElementById('modal-envio').classList.add('ativo');
  document.getElementById('input-arquivos-envio').value = '';
  document.getElementById('status-envio').textContent = '';
}

function fecharEnvioDoc() { document.getElementById('modal-envio').classList.remove('ativo'); }

async function enviarDocPresidencia() {
  const ubsIdDestino = document.getElementById('select-destino').value;
  const input = document.getElementById('input-arquivos-envio');
  const arquivos = Array.from(input.files);
  const status = document.getElementById('status-envio');

  if (!ubsIdDestino) { status.textContent = '❌ Selecione uma unidade.'; return; }
  if (arquivos.length === 0) { status.textContent = '❌ Selecione pelo menos um arquivo.'; return; }
  for (const f of arquivos) {
    if (f.size > LIMITE_MB * 1024 * 1024) {
      status.textContent = `❌ "${f.name}" excede ${LIMITE_MB}MB.`;
      return;
    }
  }

  status.textContent = `⏳ Enviando ${arquivos.length} arquivo(s)...`;
  const documentos = [];
  for (const f of arquivos) {
    const nome = `presidencia/${ubsIdDestino}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    try {
      const { error } = await supabaseClient.storage.from(BUCKET).upload(nome, f, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(nome);
      documentos.push({ nome: f.name, tamanho: f.size, url: urlData.publicUrl, path: nome, ts: new Date().toISOString() });
    } catch (e) {
      status.textContent = `❌ Falha em "${f.name}": ${e.message}`;
      return;
    }
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'documento_matriz', ubs_id: ubsIdDestino, documentos }));
    status.textContent = `✅ ${documentos.length} documento(s) enviado(s)!`;
    setTimeout(fecharEnvioDoc, 1500);
  } else {
    status.textContent = '❌ WebSocket desconectado.';
  }
}

// ============ MENSAGENS ============
async function carregarDestinatarios() {
  try {
    const res = await fetch('/api/mensagens/destinatarios');
    const data = await res.json();
    if (data.ok) {
      const sel = document.getElementById('msg-destino');
      sel.innerHTML = '<option value="">— Selecione o destinatário —</option>';
      (data.destinos || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.tipo + '|' + d.id;
        opt.textContent = d.nome;
        sel.appendChild(opt);
      });
    }
  } catch (e) { console.error(e); }
}

async function carregarMensagens() {
  try {
    const res = await fetch('/api/mensagens');
    const data = await res.json();
    if (data.ok) {
      mensagensRecebidas = data.recebidas || [];
      mensagensEnviadas = data.enviadas || [];
      msgsNaoLidas = mensagensRecebidas.filter(m => !m.lida).length;
      atualizarBadgeMsgs();
      renderRecebidas();
      renderEnviadas();
    }
  } catch (e) { console.error(e); }
}

function atualizarBadgeMsgs() {
  const badge = document.getElementById('badge-msgs');
  const tabBadge = document.getElementById('tab-badge-recebidas');
  if (msgsNaoLidas > 0) {
    badge.style.display = 'inline-block';
    badge.textContent = msgsNaoLidas;
    tabBadge.style.display = 'inline-block';
    tabBadge.textContent = msgsNaoLidas;
  } else {
    badge.style.display = 'none';
    tabBadge.style.display = 'none';
  }
}

function abrirMensagens() {
  document.getElementById('modal-msgs').classList.add('ativo');
  mudarTabMsgs('recebidas');
}

function fecharMensagens() { document.getElementById('modal-msgs').classList.remove('ativo'); }

function mudarTabMsgs(tab) {
  document.querySelectorAll('.msgs-tab').forEach(t => t.classList.toggle('ativo', t.dataset.tab === tab));
  document.querySelectorAll('.msgs-painel').forEach(p => p.classList.remove('ativo'));
  document.getElementById('painel-' + tab).classList.add('ativo');
  if (tab === 'compor') {
    document.getElementById('msg-assunto').value = '';
    document.getElementById('msg-corpo').value = '';
    document.getElementById('msg-anexos').value = '';
    document.getElementById('msg-destino').value = '';
    document.getElementById('msg-prioridade').value = 'info';
    document.getElementById('aviso-msg').classList.remove('ativo');
  }
}

function renderRecebidas() {
  const p = document.getElementById('painel-recebidas');
  if (mensagensRecebidas.length === 0) { p.innerHTML = '<div class="doc-vazio">Nenhuma mensagem recebida.</div>'; return; }
  p.innerHTML = '';
  mensagensRecebidas.forEach(m => {
    const div = document.createElement('div');
    div.className = `msg-item ${m.prioridade} ${!m.lida ? 'nao-lida' : ''}`;
    div.onclick = () => abrirDetalheMsg(m, 'recebida');
    div.innerHTML = `
      <div class="header">
        <div class="assunto">${m.assunto} <span class="prioridade ${m.prioridade}">${m.prioridade}</span></div>
        <div class="data">${formatarData(m.ts)}</div>
      </div>
      <div class="remetente">De: <b>${m.de_nome}</b></div>
      <div class="preview">${m.corpo}</div>`;
    p.appendChild(div);
  });
}

function renderEnviadas() {
  const p = document.getElementById('painel-enviadas');
  if (mensagensEnviadas.length === 0) { p.innerHTML = '<div class="doc-vazio">Nenhuma mensagem enviada.</div>'; return; }
  p.innerHTML = '';
  mensagensEnviadas.forEach(m => {
    const div = document.createElement('div');
    div.className = `msg-item ${m.prioridade}`;
    div.onclick = () => abrirDetalheMsg(m, 'enviada');
    div.innerHTML = `
      <div class="header">
        <div class="assunto">${m.assunto} <span class="prioridade ${m.prioridade}">${m.prioridade}</span></div>
        <div class="data">${formatarData(m.ts)}</div>
      </div>
      <div class="remetente">Para: <b>${m.para_nome}</b></div>
      <div class="preview">${m.corpo}</div>`;
    p.appendChild(div);
  });
}

function abrirDetalheMsg(m, tipo) {
  if (tipo === 'recebida' && !m.lida) {
    m.lida = true;
    msgsNaoLidas = Math.max(0, msgsNaoLidas - 1);
    atualizarBadgeMsgs();
    renderRecebidas();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'marcar_mensagem_lida', mensagem_id: m.id }));
    }
  }

  const p = document.getElementById('painel-' + (tipo === 'recebida' ? 'recebidas' : 'enviadas'));
  const anexosHTML = (m.anexos && m.anexos.length > 0) ? `
    <div class="anexos">
      <h5>📎 Anexos (${m.anexos.length})</h5>
      ${m.anexos.map(a => `
        <div class="anexo-item">
          <span>📄 ${a.nome} <span style="color:#64748b;">(${(a.tamanho/1024).toFixed(0)} KB)</span></span>
          <a href="${a.url}" target="_blank" rel="noopener">Baixar</a>
        </div>`).join('')}
    </div>` : '';

  p.innerHTML = `
    <button class="btn-voltar" onclick="mudarTabMsgs('${tipo === 'recebida' ? 'recebidas' : 'enviadas'}')">← Voltar</button>
    <div class="msg-detalhe">
      <div class="topo">
        <h4>${m.assunto}</h4>
        <div class="meta">
          <div><b>De:</b> ${m.de_nome}</div>
          <div><b>Para:</b> ${m.para_nome}</div>
          <div><b>Data:</b> ${new Date(m.ts).toLocaleString('pt-BR')}</div>
          <div><b>Prioridade:</b> <span class="prioridade ${m.prioridade}">${m.prioridade}</span></div>
        </div>
      </div>
      <div class="corpo">${m.corpo}</div>
      ${anexosHTML}
    </div>`;
}

async function enviarMensagem() {
  const sel = document.getElementById('msg-destino');
  const assunto = document.getElementById('msg-assunto').value.trim();
  const prioridade = document.getElementById('msg-prioridade').value;
  const corpo = document.getElementById('msg-corpo').value.trim();
  const inputAnexos = document.getElementById('msg-anexos');
  const btn = document.getElementById('btn-enviar-msg');

  if (!sel.value) return mostrarAvisoForm('erro', '❌ Selecione um destinatário.');
  if (!assunto) return mostrarAvisoForm('erro', '❌ Preencha o assunto.');
  if (!corpo) return mostrarAvisoForm('erro', '❌ Escreva a mensagem.');

  const [destino_tipo, destino_id] = sel.value.split('|');
  const arquivos = Array.from(inputAnexos.files);
  for (const f of arquivos) {
    if (f.size > LIMITE_MB * 1024 * 1024) {
      return mostrarAvisoForm('erro', `❌ "${f.name}" excede ${LIMITE_MB}MB.`);
    }
  }

  btn.disabled = true;
  btn.textContent = arquivos.length > 0 ? `Enviando ${arquivos.length} anexo(s)...` : 'Enviando...';

  const anexos = [];
  for (const f of arquivos) {
    const nome = `mensagens/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
    try {
      const { error } = await supabaseClient.storage.from(BUCKET).upload(nome, f, { cacheControl: '3600', upsert: false });
      if (error) throw error;
      const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(nome);
      anexos.push({ nome: f.name, tamanho: f.size, url: urlData.publicUrl, path: nome });
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '📤 Enviar mensagem';
      return mostrarAvisoForm('erro', `❌ Falha em "${f.name}": ${e.message}`);
    }
  }

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    btn.disabled = false;
    btn.textContent = '📤 Enviar mensagem';
    return mostrarAvisoForm('erro', '❌ WebSocket desconectado.');
  }

  ws.send(JSON.stringify({
    type: 'enviar_mensagem',
    destino_tipo, destino_id, assunto, prioridade, corpo, anexos
  }));

  btn.disabled = false;
  btn.textContent = '📤 Enviar mensagem';
  mostrarAvisoForm('ok', '✅ Mensagem enviada!');
  setTimeout(() => mudarTabMsgs('enviadas'), 1200);
}

function mostrarAvisoForm(tipo, msg) {
  const a = document.getElementById('aviso-msg');
  a.textContent = msg;
  a.className = 'aviso-form ativo' + (tipo === 'erro' ? ' erro' : '');
  if (tipo === 'ok') setTimeout(() => a.classList.remove('ativo'), 3000);
}

// ============ AVISOS ============
function mostrarAviso(aviso) {
  const b = document.getElementById('aviso-banner');
  const t = document.getElementById('aviso-texto');
  t.textContent = `[${aviso.prioridade.toUpperCase()}] ${aviso.mensagem}`;
  b.className = 'aviso-banner ativo' + (aviso.prioridade === 'urgente' ? ' urgente' : '');
  if (aviso.prioridade !== 'urgente') setTimeout(() => b.classList.remove('ativo'), 12000);
}

function mostrarToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#6d28d9;color:white;padding:14px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.5);z-index:9999;animation:slideIn 0.3s ease;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

const style = document.createElement('style');
style.textContent = '@keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }';
document.head.appendChild(style);

// ============ INICIALIZA ============
inicializar();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
