<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login — Matriz UBS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 360px; max-width: 100%; }
  h1 { font-size: 20px; margin-bottom: 4px; text-align: center; }
  h2 { font-size: 13px; color: #94a3b8; font-weight: normal; margin-bottom: 24px; text-align: center; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
  input { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #3b82f6; }
  button { background: #3b82f6; border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .erro { background: #7f1d1d; border: 1px solid #dc2626; color: #fecaca; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
  .erro.ativo { display: block; }
  .rodape { font-size: 11px; color: #64748b; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="box">
  <h1>🏥 Matriz UBS</h1>
  <h2>Acesso restrito</h2>
  <div class="erro" id="erro">Senha incorreta.</div>
  <label>Senha</label>
  <input type="password" id="senha" autofocus onkeydown="if(event.key==='Enter') entrar()">
  <button id="btn" onclick="entrar()">Entrar</button>
  <div class="rodape">Sessão válida por 24 horas</div>
</div>
<script>
async function entrar() {
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn');
  const erro = document.getElementById('erro');
  if (!senha) return;

  btn.disabled = true;
  btn.textContent = 'Verificando...';
  erro.classList.remove('ativo');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const data = await res.json();
    if (data.ok) {
      // guarda token em cookie + localStorage (24h)
      document.cookie = `token=${data.token}; path=/; max-age=${24*60*60}; SameSite=Strict`;
      localStorage.setItem('token_ubs', data.token);
      location.href = '/matriz';
    } else {
      erro.textContent = data.erro || 'Senha incorreta.';
      erro.classList.add('ativo');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      document.getElementById('senha').value = '';
      document.getElementById('senha').focus();
    }
  } catch (e) {
    erro.textContent = 'Erro de conexão com o servidor.';
    erro.classList.add('ativo');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
