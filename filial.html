<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">
<title>Painel da Unidade — Fundação São Sebastião</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; min-height: 100vh; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 13px; color: #94a3b8; font-weight: normal; margin-bottom: 20px; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #1e293b; border-radius: 10px; border: 1px solid #334155; margin-bottom: 16px; font-size: 13px; flex-wrap: wrap; gap: 8px; }
  .status-bar .info { display: flex; flex-direction: column; }
  .status-bar .nome-unidade { font-size: 15px; font-weight: 600; color: #f1f5f9; }
  .status-bar .nome-diretoria { font-size: 11px; color: #64748b; margin-top: 2px; }
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .status-dot.offline { background: #ef4444; }
  .config { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .config label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; margin-top: 8px; }
  .config input, .config select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 12px; border-radius: 6px; font-size: 13px; width: 100%; }
  .config select:focus, .config input:focus { outline: none; border-color: #3b82f6; }
  .btn { background: #3b82f6; border: none; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn.verde { background: #16a34a; }
  .btn.verde:hover { background: #15803d; }
  .btn.anexo { background: #0891b2; font-size: 11px; padding: 6px 10px; margin-top: 6px; }
  .btn.anexo:hover { background: #0e7490; }
  .grid-setores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
  .setor-card { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 16px; }
  .setor-nome { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; }
  .campo { margin-bottom: 8px; }
  .campo label { font-size: 10px; color: #94a3b8; display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .campo input { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 8px 10px; border-radius: 6px; font-size: 12px; width: 100%; }
  .campo input:focus { outline: none; border-color: #3b82f6; }
  .btn-setor { background: #2563eb; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 8px; font-weight: 600; }
  .btn-setor:hover { background: #1d4ed8; }
  .log { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; max-height: 220px; overflow-y: auto; color: #94a3b8; margin-top: 20px; }
  .log-entry { padding: 3px 0; border-bottom: 1px solid #1e293b; }
  .log-entry.ok { color: #22c55e; } .log-entry.err { color: #ef4444; } .log-entry.info { color: #3b82f6; }
  .aviso { background: #7f1d1d; border: 1px solid #dc2626; color: #fecaca; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 13px; }
  .aviso.ativo { display: block; }
  .secao-docs { margin-top: 24px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
  .secao-docs h3 { font-size: 15px; color: #f1f5f9; margin-bottom: 4px; }
  .secao-docs .sub { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
  .doc-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 12px; border-left: 3px solid #a855f7; }
  .doc-item .info { flex: 1; min-width: 0; }
  .doc-item .nome { color: #e2e8f0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-item .meta { color: #64748b; font-size: 10px; margin-top: 2px; }
  .doc-item a { color: #3b82f6; text-decoration: none; padding: 5px 12px; background: #1e3a8a; border-radius: 4px; font-size: 11px; white-space: nowrap; margin-left: 8px; font-weight: 600; }
  .doc-item a:hover { background: #1d4ed8; }
  .doc-vazio { color: #64748b; font-size: 12px; text-align: center; padding: 20px; }
  .fila-info { font-size: 11px; color: #f59e0b; margin-top: 8px; display: none; padding: 8px 12px; background: #78350f; border-radius: 6px; }
  .fila-info.ativo { display: block; }
  .loading { text-align: center; padding: 40px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h1>🏥 Painel da Unidade</h1>
  <h2>Envie atualizações e documentos para sua Diretoria</h2>

  <div class="aviso" id="aviso-box"><b>📢 AVISO DA DIREÇÃO:</b> <span id="aviso-texto"></span></div>

  <div class="status-bar" id="status-bar" style="display:none;">
    <div class="info">
      <div class="nome-unidade" id="ubs-nome">—</div>
      <div class="nome-diretoria" id="ubs-diretoria">—</div>
    </div>
    <div>
      <span class="status-dot offline" id="status-dot"></span>
      <span id="status-texto">Desconectado</span>
    </div>
  </div>

  <div class="config" id="config-box">
    <div class="loading" id="loading-box">Carregando lista de unidades...</div>
    <div id="form-registro" style="display:none;">
      <label>Selecione sua Unidade</label>
      <select id="select-usf">
        <option value="">— Selecione —</option>
      </select>
      <label>Servidor (deixe vazio se aberto pelo mesmo servidor)</label>
      <input type="text" id="input-servidor" placeholder="(vazio = mesma origem)">
      <button class="btn verde" style="margin-top:16px;width:100%;" onclick="registrar()">✅ Registrar e Conectar</button>
    </div>
  </div>

  <div class="grid-setores" id="grid-setores" style="display:none;"></div>

  <div class="secao-docs" id="secao-docs" style="display:none;">
    <h3>📁 Documentos recebidos da Diretoria</h3>
    <div class="sub">Arquivos enviados diretamente para esta unidade</div>
    <div id="lista-docs">
      <div class="doc-vazio">Nenhum documento recebido ainda.</div>
    </div>
  </div>

  <div class="fila-info" id="fila-info"></div>
  <div class="log" id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://gtmgqvoesezshgsthxhr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9v7pBfemMd0MR8E55Tkt4g_oknrNWrc';
const BUCKET = 'ubs-documentos';
const LIMITE_MB = 10;
const CHAVE_FILA = 'ubs_fila_documentos';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let ubsId = null;
let ubsNome = null;
let ubsRegiao = null;
let ubsDiretoria = null;
let servidor = null;
let online = false;
let ws = null;
let hb = null;
let listaUSF = [];
let documentosRecebidos = [];
let autoRegistroFeito = false;
let filaDocumentos = [];

const SETORES = [
  { id: 'recepcao',      nome: 'Recepção',      campos: ['atendimentos', 'fila'] },
  { id: 'enfermagem',    nome: 'Enfermagem',    campos: ['procedimentos', 'leitos'] },
  { id: 'farmacia',      nome: 'Farmácia',      campos: ['estoque', 'dispensacoes'] },
  { id: 'administracao', nome: 'Administração', campos: ['processos', 'oficios'] }
];

function log(msg, tipo = 'info') {
  const d = document.getElementById('log');
  const e = document.createElement('div');
  e.className = `log-entry ${tipo}`;
  e.textContent = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
  d.appendChild(e);
  d.scrollTop = d.scrollHeight;
}

// ============ FILA PERSISTENTE ============
function carregarFila() {
  try {
    const raw = localStorage.getItem(CHAVE_FILA);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        filaDocumentos = parsed.filter(p => !p.ubs_id || p.ubs_id === ubsId);
        atualizarInfoFila();
      }
    }
  } catch (e) { filaDocumentos = []; }
}

function salvarFila() {
  try {
    localStorage.setItem(CHAVE_FILA, JSON.stringify(filaDocumentos));
    atualizarInfoFila();
  } catch (e) {}
}

function atualizarInfoFila() {
  const info = document.getElementById('fila-info');
  if (!info) return;
  if (filaDocumentos.length === 0) {
    info.classList.remove('ativo');
    info.textContent = '';
  } else {
    info.classList.add('ativo');
    info.textContent = `⏳ ${filaDocumentos.length} documento(s) na fila aguardando conexão...`;
  }
}

function enfileirarDocumento(payload) {
  payload.ubs_id = ubsId;
  filaDocumentos.push(payload);
  salvarFila();
  tentarEnviarFila();
}

function tentarEnviarFila() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (filaDocumentos.length === 0) return;
  const restantes = [];
  let enviados = 0;
  for (const payload of filaDocumentos) {
    if (payload.ubs_id !== ubsId) { restantes.push(payload); continue; }
    try { ws.send(JSON.stringify(payload)); enviados++; }
    catch (e) { restantes.push(payload); }
  }
  filaDocumentos = restantes;
  salvarFila();
  if (enviados > 0) log(`📎 ${enviados} documento(s) enviado(s)`, 'ok');
}

// ============ CARREGA USFs ============
async function carregarUSFs() {
  const sel = document.getElementById('select-usf');
  try {
    const res = await fetch(location.origin + '/api/usfs');
    const data = await res.json();
    listaUSF = data.usfs || [];

    // Agrupa por região/diretoria
    const regioes = {};
    listaUSF.forEach(u => {
      const r = u.regiao || 'Outros';
      if (!regioes[r]) regioes[r] = [];
      regioes[r].push(u);
    });

    sel.innerHTML = '<option value="">— Selecione sua Unidade —</option>';
    Object.keys(regioes).sort().forEach(reg => {
      const optgroup = document.createElement('optgroup');
      optgroup.label = reg;
      regioes[reg].forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = u.nome;
        optgroup.appendChild(opt);
      });
      sel.appendChild(optgroup);
    });

    document.getElementById('loading-box').style.display = 'none';
    document.getElementById('form-registro').style.display = 'block';

    // Auto-registro via URL
    const params = new URLSearchParams(location.search);
    const usfParam = params.get('usf');
    if (usfParam && listaUSF.find(u => u.id === usfParam)) {
      sel.value = usfParam;
      log(`🔗 Unidade detectada: ${usfParam}`, 'ok');
      log(`⚡ Auto-conectando...`, 'info');

      if (!autoRegistroFeito) {
        autoRegistroFeito = true;
        setTimeout(() => { if (!online) registrar(); }, 800);
      }
    }
  } catch (e) {
    document.getElementById('loading-box').textContent = 'Erro ao carregar lista. Recarregue a página.';
    log(`❌ Erro ao carregar unidades: ${e.message}`, 'err');
  }
}

// ============ REGISTRAR ============
async function registrar() {
  const sel = document.getElementById('select-usf');
  const usfId = sel.value;

  if (!usfId) return log('❌ Selecione uma unidade', 'err');
  const usf = listaUSF.find(u => u.id === usfId);
  if (!usf) return log('❌ Unidade inválida', 'err');

  ubsId = usf.id;
  ubsNome = usf.nome;
  ubsRegiao = usf.regiao;
  // Determina diretoria a partir da região (heurística simples)
  ubsDiretoria = usf.regiao || 'Diretoria';

  const campo = document.getElementById('input-servidor').value.trim().replace(/\/$/, '');
  servidor = campo || location.origin;

  const setoresIniciais = SETORES.map(s => ({
    id: s.id,
    nome: s.nome,
    dados: Object.fromEntries(s.campos.map(c => [c, '']))
  }));

  try {
    const res = await fetch(`${servidor}/api/registrar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ubs_id: ubsId,
        nome: ubsNome,
        regiao: ubsRegiao,
        setores: setoresIniciais
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    online = true;
    document.getElementById('ubs-nome').textContent = ubsNome;
    document.getElementById('ubs-diretoria').textContent =
      data.ubs?.diretoria_nome ? '📁 ' + data.ubs.diretoria_nome : (ubsDiretoria || '');
    document.getElementById('status-dot').className = 'status-dot online';
    document.getElementById('status-texto').textContent = 'Online';
    document.getElementById('config-box').style.display = 'none';
    document.getElementById('status-bar').style.display = 'flex';
    document.getElementById('grid-setores').style.display = 'grid';
    document.getElementById('secao-docs').style.display = 'block';

    log(`✅ Conectada como ${ubsNome}`, 'ok');
    if (data.ubs?.diretoria_nome) log(`📁 Diretoria: ${data.ubs.diretoria_nome}`, 'info');

    carregarFila();
    renderSetores();
    conectarWS();
    iniciarHeartbeat();
  } catch (e) {
    log(`❌ Falha: ${e.message}`, 'err');
  }
}

// ============ SETORES ============
function renderSetores() {
  const g = document.getElementById('grid-setores');
  g.innerHTML = '';
  SETORES.forEach(s => {
    const c = document.createElement('div');
    c.className = 'setor-card';
    const camposHTML = s.campos.map(campo => `
      <div class="campo">
        <label>${campo}</label>
        <input type="text" id="input-${s.id}-${campo}" placeholder="digite livremente...">
      </div>`).join('');
    c.innerHTML = `
      <div class="setor-nome">📋 ${s.nome}</div>
      ${camposHTML}
      <button class="btn-setor" onclick="enviarDados('${s.id}')">📤 Enviar atualização</button>
      <button class="btn btn-anexo" style="width:100%;margin-top:6px;" onclick="anexarSetor('${s.id}','${s.nome}')">📎 Anexar documento</button>`;
    g.appendChild(c);
  });
}

function enviarDados(setorId) {
  if (!online) return log('❌ Não conectada ao servidor', 'err');
  const setor = SETORES.find(s => s.id === setorId);
  if (!setor) return;

  const dados = {};
  setor.campos.forEach(campo => {
    const el = document.getElementById(`input-${setorId}-${campo}`);
    dados[campo] = el ? el.value.trim() : '';
  });

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'dados_setor', ubs_id: ubsId, setor_id: setorId, dados }));
    log(`📤 Enviado ${setor.nome}`, 'ok');
  } else {
    log('❌ WebSocket desconectado', 'err');
  }
}

// ============ ANEXAR ============
function anexarSetor(setorId, setorNome) {
  if (!online) return log('❌ Não conectada ao servidor', 'err');
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.accept = '*/*';

  input.onchange = async () => {
    const arquivos = Array.from(input.files);
    if (arquivos.length === 0) return;

    for (const f of arquivos) {
      if (f.size > LIMITE_MB * 1024 * 1024) {
        return log(`❌ "${f.name}" excede ${LIMITE_MB}MB`, 'err');
      }
    }

    log(`⏳ Enviando ${arquivos.length} arquivo(s)...`, 'info');
    const documentos = [];
    for (const f of arquivos) {
      const nome = `${ubsId}/${setorId}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      try {
        const { error } = await supabaseClient.storage
          .from(BUCKET)
          .upload(nome, f, { cacheControl: '3600', upsert: false });
        if (error) throw error;
        const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(nome);
        documentos.push({
          nome: f.name, tamanho: f.size, url: urlData.publicUrl, path: nome, ts: new Date().toISOString()
        });
        log(`  ✓ ${f.name}`, 'ok');
      } catch (e) {
        log(`  ❌ Falha em "${f.name}": ${e.message}`, 'err');
      }
    }

    if (documentos.length > 0) {
      enfileirarDocumento({
        type: 'documento_setor',
        ubs_id: ubsId,
        setor_id: setorId,
        setor_nome: setorNome,
        documentos
      });
      log(`📥 ${documentos.length} documento(s) na fila`, 'info');
    }
  };
  input.click();
}

// ============ WEBSOCKET ============
function conectarWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);

  ws.onopen = () => {
    log('🔌 Conectada', 'ok');
    ws.send(JSON.stringify({ type: 'ola_filial', ubs_id: ubsId }));
    setTimeout(() => {
      if (filaDocumentos.length > 0) {
        log(`🔄 Reenviando ${filaDocumentos.length} pendente(s)...`, 'info');
        tentarEnviarFila();
      }
    }, 500);
  };
  ws.onclose = () => {
    log('🔌 Reconectando em 3s...', 'err');
    setTimeout(conectarWS, 3000);
  };
  ws.onerror = () => log('⚠️ Erro na conexão', 'err');
  ws.onmessage = (ev) => {
    try {
      const m = JSON.parse(ev.data);
      if (m.type === 'aviso') {
        document.getElementById('aviso-box').classList.add('ativo');
        document.getElementById('aviso-texto').textContent =
          `[${m.aviso.prioridade.toUpperCase()}] ${m.aviso.mensagem}`;
        log(`📢 Aviso: ${m.aviso.mensagem}`, 'info');
      }
      if (m.type === 'documento_recebido' && m.origem === 'matriz' && m.ubs_id === ubsId) {
        adicionarDocumentos(m.documentos);
        log(`📁 ${m.documentos.length} documento(s) recebido(s)`, 'ok');
      }
    } catch (e) {}
  };
}

function adicionarDocumentos(docs) {
  docs.forEach(d => documentosRecebidos.unshift(d));
  renderDocumentos();
}

function renderDocumentos() {
  const lista = document.getElementById('lista-docs');
  if (documentosRecebidos.length === 0) {
    lista.innerHTML = '<div class="doc-vazio">Nenhum documento recebido ainda.</div>';
    return;
  }
  lista.innerHTML = '';
  documentosRecebidos.slice(0, 50).forEach(d => {
    const item = document.createElement('div');
    item.className = 'doc-item';
    const tamanho = d.tamanho ? ` • ${(d.tamanho/1024).toFixed(0)} KB` : '';
    const data = d.ts ? new Date(d.ts).toLocaleString('pt-BR') : '';
    item.innerHTML = `
      <div class="info">
        <div class="nome">📄 ${d.nome}</div>
        <div class="meta">${data}${tamanho}</div>
      </div>
      <a href="${d.url}" target="_blank" rel="noopener">Baixar</a>`;
    lista.appendChild(item);
  });
}

// ============ HEARTBEAT ============
function iniciarHeartbeat() {
  clearInterval(hb);
  hb = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'heartbeat', ubs_id: ubsId }));
    }
  }, 2000);
}

// ============ INICIALIZA ============
carregarUSFs();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
